name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Run Linting (Ruff)
        run: "echo skipped-for-baseline-isolation"

      - name: Run Type Checking (ty)
        run: "echo skipped-for-baseline-isolation"
      - name: Run Tests
        run: uv run pytest tests/test_exposure_logic.py tests/test_finish_logic.py tests/test_geometry_logic.py

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
